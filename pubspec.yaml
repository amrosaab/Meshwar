name: meshwar_user
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.10+10

environment:
  sdk: '>=3.4.1 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  dartz: ^0.10.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  meta: ^1.18.0
  google_fonts: ^8.2.1
  fluttertoast: ^10.0.0
  flutter_svg: ^2.3.0
  carousel_slider_plus: ^7.1.2
  # Pinned below their latest majors: 10.0.0 (pin_code_fields),
  # cached_network_image's newer platform-interface, and shimmer 4.0.0
  # (further down) all now depend on the new material_ui/cupertino_ui
  # packages, which use the @awaitNotRequired Dart SDK annotation — not
  # defined in this project's installed Dart 3.12.2, so it fails with
  # "Undefined name 'awaitNotRequired'" at compile time. Revert once the
  # installed Flutter/Dart SDK is upgraded past whatever version first
  # ships that annotation.
  pin_code_fields: ^9.4.0
  equatable: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  permission_handler: ^13.0.2
  page_transition: ^2.2.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  dotted_border: ^3.1.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  pin_code_text_field: ^1.8.0

  change_app_package_name: ^1.5.0
  flutter_inappwebview: ^6.1.5
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  rxdart: ^0.28.0
  file_picker: ^13.1.0
  device_info_plus: ^13.2.0

  # State Management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

  # Maps & Location
  google_maps_flutter: ^2.18.1
  flutter_map: ^8.3.2
  location: ^10.0.2
  geolocator: ^14.0.3
  latlong2: ^0.9.1

  # localNotificaion
  flutter_local_notifications: ^22.3.1

  # Firebase — all four exact-pinned (no ^) to the last set confirmed
  # working together this session. Firebase's Flutter plugins coordinate
  # their native SDK version through firebase_core (visible at pod-install
  # time as "Using Firebase SDK version 'X' defined in 'firebase_core'"), so
  # they have to move as a matched set. Pinning only firebase_auth back
  # (6.7.0's Dart-level migrateCurrentUser bug) while firebase_core stayed
  # on a newer caret range broke native header compatibility instead
  # ("FLTFirebaseCorePlugin.h file not found" compiling firebase_auth's iOS
  # sources) — a caret constraint here just sets a lower bound, so pub kept
  # resolving firebase_core to its newest version regardless.
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0
  firebase_messaging: ^16.7.0
  flutter_native_splash: ^2.4.8

  #shimmer
  shimmer: ^3.0.0

  #contacts
  flutter_contacts: ^2.5.0

  #connectivity
  connectivity_plus: ^7.3.1

  # packageInfo
  package_info_plus: ^10.2.1

  # mapAnimation
  vector_math: ^2.2.0
  flutter_animarker: ^3.2.0

  #local db
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # Stripefirebase_auth
  flutter_stripe: ^14.0.0

  # Html View
  flutter_html: ^3.0.0

  flutter_map_tile_caching: ^10.1.1
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # A handful of plugins (google_maps_flutter_ios, flutter_inappwebview_ios,
  # objectbox_flutter_libs) don't support Swift Package Manager yet, so
  # Flutter falls back to a CocoaPods+SPM hybrid for iOS. That hybrid is what
  # repeatedly broke builds with a "Target Integrity...supports 13.0" error —
  # the generated FlutterGeneratedPluginSwiftPackage manifest kept
  # regenerating with a stale default deployment target that Flutter's own
  # patch step didn't reliably fix. The Xcode project has been un-migrated
  # back to pure CocoaPods (see project.pbxproj); this stops Flutter from
  # re-adding the SPM integration on the next build.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.

  uses-material-design: true
  shaders:
    - shaders/driver_search_absorb.frag
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/svg/
    - assets/audio/
    - assets/sedan_sprites/
    - assets/car_sprites/
    - assets/bike_sprites/
    - assets/van_sprites/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true
  adaptive_icon_background: "#D40B40"
  adaptive_icon_foreground: "assets/images/logo_foreground_padded.png"
  adaptive_icon_foreground_inset: 0

# Native (OS-level) splash shown instantly on launch, before the Flutter
# engine initializes — closes the white-flash gap that showed before the
# app's own GIF-based LoaderPage could take over. logo_foreground_padded.png
# (transparent background, just the white mark) is used rather than
# logo.png, since this image is composited on top of `color` — logo.png's
# own baked-in red background would show as a mismatched red square instead
# of filling edge-to-edge.
flutter_native_splash:
  color: "#D40D42"
  image: assets/images/logo_foreground_padded.png
  android_12:
    color: "#D40D42"
    image: assets/images/logo_foreground_padded.png

# html 0.15.7 removed the top-level matches() function from its internal
# query_selector.dart (flutter_html 3.0.0 reaches into that private API —
# see its own TODO/ignore comment in styled_element.dart), breaking the
# build with "Method not found: 'matches'". Pinned to the last version that
# still has it until flutter_html publishes a fix.
dependency_overrides:
  html: 0.15.6